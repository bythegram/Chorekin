<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Visualizer Prototype</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <style>
        :root { --brand-gold: #d4af37; --brand-navy: #1a2b3c; }
        .modal-content { border-radius: 20px; border: none; overflow: hidden; }
        #map-holder { background: #f8f9fa; border-radius: 12px; height: 300px; position: relative; }
        .flight-path { fill: none; stroke: var(--brand-gold); stroke-width: 2; stroke-dasharray: 5,5; opacity: 0; transition: opacity 0.5s; }
        .active-path { opacity: 1; }
        .apply-btn { background: linear-gradient(180deg, #f3d078 0%, #d4af37 100%); border: none; font-weight: bold; }
        .spend-label { font-size: 0.85rem; color: #666; }
    </style>
</head>
<body class="bg-secondary p-5">

<div class="text-center">
    <button type="button" class="btn btn-light btn-lg" data-bs-toggle="modal" data-bs-target="#visualizerModal">
        Launch Visualizer
    </button>
</div>

<div class="modal fade" id="visualizerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title w-100 text-center small text-uppercase tracking-widest">The Destination Visualizer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4">
                <div class="mb-3">
                    <label class="form-label fw-bold small">PLAN YOUR ESCAPE</label>
                    <select id="originSelect" class="form-select border-2">
                        <option value="">Select Starting City...</option>
                        <option value="JFK" data-lat="40.71" data-lon="-74.00">New York (JFK)</option>
                        <option value="LAX" data-lat="34.05" data-lon="-118.24">Los Angeles (LAX)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="fw-bold small">Monthly Spend: <span id="spendVal">$0</span></span>
                        <span class="spend-label" id="pointsVal">0 Points</span>
                    </div>
                    <input type="range" class="form-range" id="spendSlider" min="0" max="8000" step="100" disabled>
                </div>

                <div id="map-holder" class="mb-3">
                    <svg id="worldMap" width="100%" height="100%"></svg>
                </div>

                <div class="text-center mb-3">
                    <p class="small mb-1 text-muted">Fly There Faster —</p>
                    <button class="btn apply-btn w-100 py-2">Apply Now &gt;</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const config = { bonus: 50000, multiplier: 1.5 };
const destinations = [
    { name: "Paris", lat: 48.85, lon: 2.35, cost: 75000 },
    { name: "London", lat: 51.50, lon: -0.12, cost: 85000 },
    { name: "Miami", lat: 25.76, lon: -80.19, cost: 60000 }
];

// Initialize D3 Map
const svg = d3.select("#worldMap");
const projection = d3.geoMercator().scale(70).translate([200, 180]);
const path = d3.geoPath().projection(projection);

d3.json("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson").then(data => {
    svg.append("g")
       .selectAll("path")
       .data(data.features)
       .enter().append("path")
       .attr("d", path)
       .attr("fill", "#e9ecef")
       .attr("stroke", "#fff");
});

const slider = document.getElementById('spendSlider');
const originSelect = document.getElementById('originSelect');

originSelect.addEventListener('change', (e) => {
    if (!e.target.value) return;
    slider.disabled = false;
    
    // Snap to Minimum Logic
    const minCost = Math.min(...destinations.map(d => d.cost));
    const minSpend = Math.max(0, (minCost - config.bonus) / (config.multiplier * 12));
    slider.value = minSpend;
    updateUI(minSpend);
});

slider.addEventListener('input', (e) => updateUI(e.target.value));

function updateUI(spend) {
    const totalPoints = (spend * config.multiplier * 12) + config.bonus;
    document.getElementById('spendVal').innerText = `$${Math.round(spend)}`;
    document.getElementById('pointsVal').innerText = `${Math.round(totalPoints).toLocaleString()} Points`;

    // Clear and Redraw Arcs
    svg.selectAll(".flight-path").remove();
    const selected = originSelect.options[originSelect.selectedIndex];
    const originCoords = [parseFloat(selected.dataset.lon), parseFloat(selected.dataset.lat)];

    destinations.forEach(d => {
        const opacity = totalPoints >= d.cost ? 1 : 0.1;
        const link = {type: "LineString", coordinates: [originCoords, [d.lon, d.lat]]};
        
        svg.append("path")
           .attr("d", path(link))
           .attr("class", "flight-path")
           .style("opacity", opacity)
           .classed("active-path", true);
    });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
